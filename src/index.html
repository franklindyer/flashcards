<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Flashcards</title>
    <link rel="stylesheet" type="text/css" href="index.css" />
  </head>
  <body>
    <div id="flashcard-widget">
        <div id="flashcard-container"></div>
        <button id="deck-edit-button">Edit deck</button>
        <button id="deck-list-button">View decks</button>
        <button id="export-deck-button">Export deck</button>
        <input id="deck-upload-file" type="file" style="display: none" />
        <button id="import-deck-button">Import deck</button>
        <input id="answer-hint" class="answer-text-box" type="text" disabled/>
        <input id="answer-input" class="answer-text-box" type="text"/>

        <br><br>

        <div id="test-menu" is="menu-deep-json">
            <div is="menu-lazy-list" search="text1,text2" max="5" name="my-lazy-list">
                <button class="menu-add-another-button">Add another</button>
                <input type="text" class="menu-search-bar" placeholder="search text..." />
                <div class="menu-list-entries"></div>
                <div class="menu-list-default-entry" is="menu-group">
                    <input is="menu-textbox" name="text1" />
                    <input is="menu-textbox" name="text2" />
                    <button class="menu-remove-entry-button">remove</button>
                    <button class="menu-restore-entry-button">restore</button>
                </div>
            </div>
            <input is="menu-checkbox" name="a" />
            <input is="menu-checkbox" name="b" />
            <input is="menu-checkbox" name="c.a" />
            <input is="menu-checkbox" name="c.b" />
            <input is="menu-checkbox" name="c.c" />
            <input is="menu-checkbox" name="d.a.a" />
            <input is="menu-checkbox" name="d.a.b" />
            <input is="menu-checkbox" name="d.b.a" />
            <input is="menu-checkbox" name="d.b.b" />
        </div>

    </div>
    <div id="flashcard-deck-editor-overlay" class="fullscreen-overlay">
        <button id="flashcard-deck-editor-close">Save and close</button>
        <div id="flashcard-deck-editor" class="menu-overlay"></div>
    </div>
    <div id="flashcard-decklist-overlay" class="fullscreen-overlay">
        <div id="flashcard-decklist-editor" class="menu-overlay"></div>
    </div>
    <a href="docs/html/users-guide/help.html">Help</a>
    <a href="docs/html/index.html">About</a>
    <script type="text/javascript" src="/bundle.js"></script>
  </body>
</html>
