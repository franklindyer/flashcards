<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="/style.css">
        <title>Flashcards help</title>
    </head>
    <body>
        <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <script type="text/x-mathjax-config">
            MathJax.Hub.Config({
                "HTML-CSS": {
                    styles: {
                        ".MathJax": {
                            padding: "0.2em 0",
                            display: "inline-block"
                        }
                    }
                }
            });
        </script>
        <div id="content-div">
            <h1 id="flashcards-help">Flashcards help</h1>
            <ul>
            <li>Press <code>Enter</code> to submit your answer.</li>
            <li>Press <code>Up Arrow</code> to mark a card as correct,
            overriding a previous incorrect answer.</li>
            <li>Press <code>Down Arrow</code> to skip a card and receive
            a new one, ignoring any previous answer.</li>
            </ul>
        </div>
    </body>
</html>
